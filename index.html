      <noscript>
        <main>
          <h1>IOE Admission Hub by Dipesh Sapkota</h1>
          <p>IOE Admission Hub is an independent admission guide and planning toolkit for Institute of Engineering (IOE), Tribhuvan University applicants in Nepal.</p>

          <nav aria-label="IOE Admission Hub sections">
            <h2>Explore IOE admission tools</h2>
            <ul>
              <li><a href="/predictor/">IOE rank predictor</a> - estimate admission probability from historical closing ranks.</li>
              <li><a href="/profile/">IOE Admission Hub profile</a> - learn about the platform and Dipesh Sapkota.</li>
              <li><a href="/campuses/">IOE campuses and seat matrix</a> - compare Pulchowk, Thapathali, WRC, ERC, and Chitwan Engineering Campus.</li>
              <li><a href="/calculator/">IOE CBT score calculator</a> - calculate a net score out of 140 with negative marking.</li>
              <li><a href="/estimator/">IOE score-to-rank estimator</a> - estimate a historical merit-rank bracket.</li>
              <li><a href="/priority/">IOE priority form optimizer</a> - build a Reach, Target, and Safety preference sequence.</li>
              <li><a href="/guide/">IOE admission guide</a> - read the counseling roadmap, merit-list rounds, documents, and seat deposits.</li>
              <li><a href="/checklist/">IOE admission checklist</a> - follow the process from entrance registration to document verification.</li>
              <li><a href="/notices/">IOE admission notices</a> - find entrance notices, circulars, merit lists, and official updates.</li>
              <li><a href="/affiliated/">TU-affiliated engineering colleges</a> - compare private engineering colleges, programs, fees, and locations.</li>
              <li><a href="/compare/">Compare IOE engineering disciplines</a> - review curriculum areas and career directions.</li>
              <li><a href="/financials/">IOE engineering fees and living costs</a> - compare Regular, Full Fee, and affiliated study paths.</li>
            </ul>
          </nav>

          <section aria-labelledby="campus-heading">
            <h2 id="campus-heading">IOE constituent campuses and seats</h2>
            <p>The reference intake is 2,040 constituent engineering seats across five campuses.</p>
            <ul>
              <li>Pulchowk Campus, Lalitpur: 624 seats</li>
              <li>Thapathali Campus, Kathmandu: 432 seats</li>
              <li>Pashchimanchal Campus (WRC), Pokhara: 432 seats</li>
              <li>Purwanchal Campus (ERC), Dharan: 528 seats</li>
              <li>Chitwan Engineering Campus (ChEC), Chitwan: 24 seats</li>
            </ul>
          </section>

          <section aria-labelledby="exam-heading">
            <h2 id="exam-heading">IOE entrance exam facts</h2>
            <p>The reference format is a two-hour Computer Based Test (CBT) worth 140 marks. The pass reference is 40 percent, or 56 marks. Incorrect answers carry a 10 percent question-weighted negative-marking deduction.</p>
            <p>Cutoffs and predictions on this website are historical references for the 2082 BS cycle, not guarantees. Confirm current deadlines, notices, seat allocations, and admission decisions with the <a href="https://entrance.ioe.edu.np/">official IOE Entrance Examination Board</a> and <a href="https://admission.ioe.edu.np/">IOE Central Admission Committee</a>.</p>
          </section>

          <section aria-labelledby="about-heading">
            <h2 id="about-heading">About IOE Admission Hub</h2>
            <p>IOE Admission Hub is created and maintained by <a href="https://www.dipeshsapkota7.com.np/">Dipesh Sapkota</a>. It is not officially operated, affiliated with, or endorsed by Tribhuvan University or the Institute of Engineering.</p>
          </section>
